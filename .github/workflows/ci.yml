name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Envoy builds come from tetratelabs/archive-envoy. The SHA-256 values are
  # the ones in envoy-v1.40.2.json of that release.
  ENVOY_VERSION: v1.40.2
  ENVOY_SHA256_LINUX_AMD64: 7490103caa169d5ab6c35a366813ea9e98196494a4fd17988e9d16af295eea98
  ENVOY_SHA256_DARWIN_ARM64: 3ccd840a1f5ec924baa56561dee913783103db2d3198ebf61f9b224c8ca9bcc0

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch the SDK
        run: go run ./cmd/patchsdk
      - name: Unit test of the patched SDK
        working-directory: sdk-patched/sdk/go/abi
        env:
          CGO_LDFLAGS: -Wl,--unresolved-symbols=ignore-all
        run: go test -v .
      - name: Vet
        run: go vet ./...
      - name: Install Envoy ${{ env.ENVOY_VERSION }}
        run: |
          name="envoy-${ENVOY_VERSION}-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/tetratelabs/archive-envoy/releases/download/${ENVOY_VERSION}/$name.tar.xz"
          echo "${ENVOY_SHA256_LINUX_AMD64}  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "ENVOY_BIN=$RUNNER_TEMP/$name/bin/envoy" >> "$GITHUB_ENV"
      - name: Check the Envoy commit
        # The SDK pin b2d89e0ae539 must be the commit of this Envoy.
        run: '"$ENVOY_BIN" --version | tee /dev/stderr | grep -q b2d89e0ae539'
      - name: Envoy tests
        run: go test -count=1 -v ./examples/...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch the SDK
        run: go run ./cmd/patchsdk
      - name: Unit test of the patched SDK
        working-directory: sdk-patched/sdk/go/abi
        run: go test -v .
      - name: Vet
        run: go vet ./...
      - name: Install Envoy ${{ env.ENVOY_VERSION }}
        run: |
          name="envoy-${ENVOY_VERSION}-darwin-arm64"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/tetratelabs/archive-envoy/releases/download/${ENVOY_VERSION}/$name.tar.xz"
          echo "${ENVOY_SHA256_DARWIN_ARM64}  $RUNNER_TEMP/$name.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "ENVOY_BIN=$RUNNER_TEMP/$name/bin/envoy" >> "$GITHUB_ENV"
      - name: Check the Envoy commit
        run: '"$ENVOY_BIN" --version | tee /dev/stderr | grep -q b2d89e0ae539'
      - name: Envoy tests
        run: go test -count=1 -v ./examples/...
